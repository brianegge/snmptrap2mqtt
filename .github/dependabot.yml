version: 2
updates:
  # uv.lock; --locked in CI and the Dockerfile means nothing moves without a PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"

  # Workflow actions, pinned by SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Dockerfile base image and the uv image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
