name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          activate-environment: true
      # Hash-checked install from uv.lock; --no-build takes dependencies as
      # wheels only, so no third-party setup script runs.
      - run: uv sync --locked --extra dev --no-build
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
