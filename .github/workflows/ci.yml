name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Hash-checked install from uv.lock; --no-build takes dependencies as
      # wheels only, so no third-party setup script runs.
      - run: uv sync --locked --extra dev --no-build
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest -q
