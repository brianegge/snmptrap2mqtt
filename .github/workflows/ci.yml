name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true
      # Hash-checked install from uv.lock; --no-build takes dependencies as
      # wheels only, so no third-party setup script runs.
      - run: uv sync --locked --extra dev --no-build
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
