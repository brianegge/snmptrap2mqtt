name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # release.yml dispatches this on the new v* tag. A tag created with the
  # workflow GITHUB_TOKEN does not fire `push: tags` (GitHub suppresses runs
  # from that token to prevent loops), but workflow_dispatch is exempt -- and
  # dispatching on the tag ref gives metadata-action refs/tags/vX.Y.Z, so the
  # semver rules below publish :X.Y.Z exactly as a hand-pushed tag would.
  workflow_dispatch:

jobs:
  # Gate the image on the same checks CI runs, so a broken build is never
  # published to the registry.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true
      # Hash-checked install from uv.lock; --no-build takes dependencies as
      # wheels only, so no third-party setup script runs.
      - run: uv sync --locked --extra dev --no-build
      - run: ruff check .
      - run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
