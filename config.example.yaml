# snmptrap2mqtt example configuration.
# Any key can be overridden with SNMPTRAP2MQTT_CONFIG_<PATH>, e.g.
#   SNMPTRAP2MQTT_CONFIG_MQTT_SERVER=mqtt://192.168.254.30:1883
#   SNMPTRAP2MQTT_CONFIG_LISTENER_PORT=1162

mqtt:
  server: mqtt://192.168.254.30:1883
  base_topic: snmptrap2mqtt
  # username: mqtt-user
  # password: secret

homeassistant:
  discovery: true
  discovery_prefix: homeassistant

listener:
  bind: 0.0.0.0
  port: 162          # needs CAP_NET_BIND_SERVICE; use 1162 + port-map otherwise
  communities: [public]   # accepted v1/v2c communities; [] accepts any

# Known senders. Traps from unlisted IPs are still published under a
# sanitized IP topic (e.g. snmptrap2mqtt/192_168_254_99/trap) but get no
# Home Assistant discovery.
targets:
  - friendly_name: boiler-switch
    host: 192.168.254.250
    manufacturer: Netgear
    model: GS728TPv2
    liveness:               # drives the availability topic
      oid: 1.3.6.1.2.1.1.3.0   # sysUpTime
      interval: 60
  - friendly_name: attic-switch
    host: 192.168.254.251
    manufacturer: Netgear
    liveness:
      interval: 60
  - friendly_name: deck-switch
    host: 192.168.254.252
    manufacturer: Netgear
    liveness:
      interval: 60
  - friendly_name: dining-switch
    host: 192.168.253.2
    manufacturer: Netgear
    liveness:
      interval: 60

# Extra/overriding OID -> event name mappings. linkUp/linkDown, cold/warm
# start, authenticationFailure and poePortChange are built in.
traps: {}
#  1.3.6.1.4.1.4526.1.2.3: someNetgearTrap
