[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snmptrap2mqtt"
description = "SNMP trap to MQTT bridge with Home Assistant discovery"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brian Egge" }]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "aiomqtt>=2.3",
    "pydantic>=2.7",
    "pysnmp>=7.1.16,<8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
snmptrap2mqtt = "snmptrap2mqtt.__main__:main"

[project.urls]
Homepage = "https://github.com/brianegge/snmptrap2mqtt"

[tool.hatch.version]
path = "snmptrap2mqtt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["snmptrap2mqtt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
