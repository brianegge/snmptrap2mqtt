# Example deployment (e.g. the garage RPi next to zigbee2mqtt/zwavejs2mqtt).
#
# UDP 162 is privileged. This example uses host networking + the bind
# capability, which also keeps the datagram source addresses intact.
# Alternative without host networking: set listener.port: 1162 (or
# SNMPTRAP2MQTT_CONFIG_LISTENER_PORT=1162), drop network_mode/cap_add, and map
#   ports: ["162:1162/udp"]
services:
  snmptrap2mqtt:
    image: ghcr.io/brianegge/snmptrap2mqtt:latest
    # Or build locally instead of pulling: comment out `image:` and use
    # build: .
    container_name: snmptrap2mqtt
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./data:/app/data
    environment:
      - SNMPTRAP2MQTT_CONFIG_MQTT_SERVER=mqtt://192.168.254.30:1883
